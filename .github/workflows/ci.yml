name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projeto-sequei
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/app_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: projeto-sequei/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build (não exige banco)
        run: npm run build
        env:
          DATABASE_URL: ""

      - name: Testes unitários
        run: npm test

      - name: Migrações versionadas
        run: npm run db:migrate

      - name: Seed de demonstração
        run: npm run db:seed

      - name: Subir servidor de produção
        run: |
          npm start &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/health && break
            sleep 1
          done

      - name: Testes E2E
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
